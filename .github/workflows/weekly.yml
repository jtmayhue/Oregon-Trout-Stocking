name: Weekly ODFW capture

on:
  schedule:
    # :17 past the hour, never :00 -- GitHub documents delays at the top of
    # every hour, and scheduled runs can be dropped entirely under load.
    - cron: '17 14 * * 1'      # Monday  14:17 UTC = 7:17am Pacific
    - cron: '17 14 * * 4'      # Thursday, same time -- insurance against a
                               # skipped Monday. Zone reports update weekly,
                               # so Thursday still catches that week's content.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      # JOB 1 -- the irreplaceable part. No continue-on-error: if this breaks
      # the whole run must go RED so GitHub emails you.
      - name: Capture zone reports
        run: python zone_snapshot.py --root ./archive

      # Version 1.2+ reads stockings-v2.json: Jan 1 of LAST year through Dec 31
      # of NEXT year. That keeps each water's history across New Year and picks
      # up next year's weeks as soon as ODFW publishes them (2027 was already
      # online in Nov 2026). stockings.json below stays current-year-only, so
      # version 1.1, which assumes a single calendar year, is unaffected.
      - name: Pull wide schedule (last year through next year)
        id: schedule_wide
        continue-on-error: true
        run: |
          YEAR=$(date +%Y)
          python odfw_ingest.py --start "$((YEAR-1))-01-01" --end "$((YEAR+1))-12-31" --out ./data-wide

      - name: Build stockings-v2.json
        if: steps.schedule_wide.outcome == 'success'
        continue-on-error: true
        run: python build_stockings.py --events ./data-wide/stocking_events.json --waters ./waters.json --out ./stockings-v2.json

      - name: Pull stocking schedule
        id: schedule
        continue-on-error: true
        run: |
          YEAR=$(date +%Y)
          python odfw_ingest.py --start "$YEAR-01-01" --end "$YEAR-12-31" --out ./data

      - name: Build stockings.json
        if: steps.schedule.outcome == 'success'
        continue-on-error: true
        run: python build_stockings.py --events ./data/stocking_events.json --waters ./waters.json --out ./stockings.json

      - name: Commit whatever we captured
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A archive data data-wide stockings.json stockings-v2.json unmatched.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "nothing changed this run"
          else
            git commit -m "Capture $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Warn if the schedule pull failed
        if: steps.schedule.outcome != 'success'
        run: |
          echo "::warning::Schedule pull failed. Open this job's 'Pull stocking schedule' step for the reason -- do not assume the cause."
          echo "The zone report archive still captured, which is the part that cannot be redone."

      - name: Warn if the wide schedule pull failed
        if: steps.schedule_wide.outcome != 'success'
        run: |
          echo "::warning::Wide schedule pull failed. stockings-v2.json was not updated this run; version 1.2+ keeps showing the previous copy."

      # CANARY. The workflow watches itself: if the newest capture on disk is
      # older than 10 days, runs have been silently skipped or the schedule was
      # auto-disabled. Failing here turns the run RED, which is what actually
      # reaches your inbox. Without this, a dead pipeline looks like silence.
      - name: Fail if captures have gone stale
        if: always()
        run: |
          NEWEST=$(ls -1 archive/raw 2>/dev/null | sort | tail -1)
          if [ -z "$NEWEST" ]; then
            echo "::error::No captures at all in archive/raw."
            exit 1
          fi
          AGE=$(( ( $(date -u +%s) - $(date -u -d "$NEWEST" +%s) ) / 86400 ))
          echo "Newest capture: $NEWEST (${AGE} days old)"
          if [ "$AGE" -gt 10 ]; then
            echo "::error::Newest capture is ${AGE} days old. Scheduled runs are not happening."
            echo "Check: Actions tab -> is the workflow disabled? GitHub disables"
            echo "scheduled workflows in public repos after 60 days of inactivity."
            exit 1
          fi
          echo "Freshness OK."
