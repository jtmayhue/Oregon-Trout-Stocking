name: Weekly ODFW capture

on:
  schedule:
    # :17 past the hour, never :00 -- GitHub documents delays at the top of
    # every hour, and scheduled runs can be dropped entirely under load.
    - cron: '17 14 * * 1'      # Monday  14:17 UTC = 7:17am Pacific
    - cron: '17 14 * * 4'      # Thursday, same time -- insurance against a
                               # skipped Monday. Zone reports update weekly,
                               # so Thursday still catches that week's content.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml

      # JOB 1 -- the irreplaceable part. No continue-on-error: if this breaks
      # the whole run must go RED so GitHub emails you.
      - name: Capture zone reports
        run: python zone_snapshot.py --root ./archive

      # ONE schedule pull, week by week, Jan 1 of LAST year through Dec 31 of
      # NEXT year. Both data files are built from it:
      #   stockings-v2.json -- the whole window, read by version 1.2+
      #   stockings.json    -- current year only, read by version 1.1
      # Week by week (with zone queries for weeks over 50 rows) because ODFW's
      # pager hides every row past the 50th; see fetch_week in odfw_ingest.py.
      - name: Keep the published files for comparison
        run: |
          mkdir -p /tmp/prev
          cp stockings-v2.json /tmp/prev/ 2>/dev/null || true
          cp stockings.json /tmp/prev/ 2>/dev/null || true

      - name: Pull schedule week by week (last year through next year)
        id: schedule_wide
        continue-on-error: true
        run: |
          YEAR=$(date +%Y)
          python odfw_ingest.py --start "$((YEAR-1))-01-01" --end "$((YEAR+1))-12-31" --out ./data-wide

      - name: Build stockings-v2.json and stockings.json
        id: build
        if: steps.schedule_wide.outcome == 'success'
        continue-on-error: true
        run: |
          YEAR=$(date +%Y)
          python build_stockings.py --events ./data-wide/stocking_events.json --waters ./waters.json --out ./stockings-v2.json
          python build_stockings.py --events ./data-wide/stocking_events.json --waters ./waters.json --out ./stockings.json --year "$YEAR"

      # Never let a thinner file replace a good one. On failure the previous
      # file is restored, so the commit below publishes nothing worse.
      - name: Guard against publishing fewer rows
        id: guard
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          rc=0
          python guard_publish.py --new stockings-v2.json --old /tmp/prev/stockings-v2.json || rc=1
          python guard_publish.py --new stockings.json --old /tmp/prev/stockings.json || rc=1
          exit $rc

      - name: Commit whatever we captured
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A archive data data-wide stockings.json stockings-v2.json unmatched.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "nothing changed this run"
          else
            git commit -m "Capture $(date -u +%Y-%m-%d)"
            git push
          fi

      # Turn the run RED (GitHub emails you) when the schedule did not publish.
      # The zone reports above were still archived, and the app keeps showing
      # the previous data, so nothing is lost while this gets looked at.
      - name: Fail if the schedule was not published
        if: steps.schedule_wide.outcome != 'success' || steps.build.outcome != 'success' || steps.guard.outcome != 'success'
        run: |
          echo "::error::Schedule not updated this run (pull=${{ steps.schedule_wide.outcome }}, build=${{ steps.build.outcome }}, guard=${{ steps.guard.outcome }}). Open the first failed step for the reason. The previous stockings files are still live."
          exit 1

      # CANARY. The workflow watches itself: if the newest capture on disk is
      # older than 10 days, runs have been silently skipped or the schedule was
      # auto-disabled. Failing here turns the run RED, which is what actually
      # reaches your inbox. Without this, a dead pipeline looks like silence.
      - name: Fail if captures have gone stale
        if: always()
        run: |
          NEWEST=$(ls -1 archive/raw 2>/dev/null | sort | tail -1)
          if [ -z "$NEWEST" ]; then
            echo "::error::No captures at all in archive/raw."
            exit 1
          fi
          AGE=$(( ( $(date -u +%s) - $(date -u -d "$NEWEST" +%s) ) / 86400 ))
          echo "Newest capture: $NEWEST (${AGE} days old)"
          if [ "$AGE" -gt 10 ]; then
            echo "::error::Newest capture is ${AGE} days old. Scheduled runs are not happening."
            echo "Check: Actions tab -> is the workflow disabled? GitHub disables"
            echo "scheduled workflows in public repos after 60 days of inactivity."
            exit 1
          fi
          echo "Freshness OK."
